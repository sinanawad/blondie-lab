# Lint for blondie-lab. Single job named `lint` (the ruleset's required check).
# No live Juju here. Fork PRs never run (same-repo `if:` below).
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      # sha256 of actionlint_1.7.12_linux_amd64.tar.gz, from the release's checksums.txt
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (pinned, checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      - name: Install zizmor (venv, hash-pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/lint-venv"
          "$RUNNER_TEMP/lint-venv/bin/pip" install --quiet --require-hashes --only-binary :all: -r lint-requirements.txt
          "$RUNNER_TEMP/lint-venv/bin/zizmor" --version

      - name: actionlint (workflows)
        run: '"$RUNNER_TEMP/actionlint" -color'

      - name: zizmor (workflows, online audits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/lint-venv/bin/zizmor" --config zizmor.yml --min-severity medium .github/workflows'

      - name: shellcheck (scripts and scenarios)
        run: |
          mapfile -t files < <(find scripts scenarios -type f -name '*.sh' 2>/dev/null | sort)
          if [ "${#files[@]}" -eq 0 ]; then echo "no shell scripts"; exit 0; fi
          printf '%s\n' "${files[@]}"
          shellcheck -x "${files[@]}"

      - name: Linters still fail on lint-fixtures/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTIONLINT="$RUNNER_TEMP/actionlint" ZIZMOR="$RUNNER_TEMP/lint-venv/bin/zizmor" \
            scripts/check-lint-fixtures.sh
