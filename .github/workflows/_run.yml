# Reusable lab harness, called by lab-lxd.yml and lab-microk8s.yml.
# No concurrency: or run-name: here (a called workflow that declares its
# caller's concurrency group waits on its own caller). Per-job permissions can
# only narrow what the calling job grants (contents: read).
# Inputs reach the shell only through env:, never as ${{ inputs.* }} in run:.
#
# PR-2 scope: validate -> scenario -> verdict -> upload. Substrate setup,
# bootstrap, collect.sh and scrub land in PR-3/PR-4; until then validate.sh
# rejects scenarios with NEEDS_JUJU=1, ref (build mode), DEPS and NEEDS_TESTS=1
# as setup-error.
name: _run

on:
  workflow_call:
    inputs:
      substrate:
        type: string
        required: true
      scenario:
        type: string
        required: true
      juju_channel:
        type: string
        required: true
      ref:
        type: string
        required: false
        default: ""
      tests_ref:
        type: string
        required: false
        default: ""
      repeat:
        type: string
        required: false
        default: "1"
      request_id:
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  lab:
    name: lab
    runs-on: ubuntu-24.04
    # Backstop only (design §2); every step has its own timeout.
    timeout-minutes: 260
    permissions:
      contents: read
    env:
      LAB_SUBSTRATE: ${{ inputs.substrate }}
      LAB_IN_SCENARIO: ${{ inputs.scenario }}
      LAB_IN_JUJU_CHANNEL: ${{ inputs.juju_channel }}
      LAB_IN_REF: ${{ inputs.ref }}
      LAB_IN_TESTS_REF: ${{ inputs.tests_ref }}
      LAB_IN_REPEAT: ${{ inputs.repeat }}
      LAB_IN_REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - name: Checkout blondie-lab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Artifact dir
        timeout-minutes: 1
        run: echo "LAB_ARTIFACT_DIR=$RUNNER_TEMP/lab-artifacts" >>"$GITHUB_ENV"

      - name: Validate inputs
        id: validate
        timeout-minutes: 3
        run: scripts/validate.sh

      - name: Run scenario
        id: scenario
        if: steps.validate.outcome == 'success'
        timeout-minutes: ${{ fromJSON(steps.validate.outputs.scenario_timeout) }}
        env:
          LAB_SCENARIO: ${{ inputs.scenario }}
          LAB_REPEAT: ${{ inputs.repeat }}
          LAB_TIMEOUT_MIN: ${{ steps.validate.outputs.timeout_min }}
        run: scripts/run-scenario.sh

      - name: Verdict and job summary
        id: verdict
        if: always()
        timeout-minutes: 2
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          SCENARIO_OUTCOME: ${{ steps.scenario.outcome }}
          LAB_NEEDS_JUJU: ${{ steps.validate.outputs.needs_juju }}
        run: scripts/verdict.sh

      - name: Upload artifact
        if: always() && steps.verdict.outputs.artifact_name != ''
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.verdict.outputs.artifact_name }}
          path: ${{ env.LAB_ARTIFACT_DIR }}
          retention-days: 7
          if-no-files-found: error

      - name: Job result (green only for pass)
        if: always()
        timeout-minutes: 1
        env:
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          echo "verdict: ${VERDICT:-missing}"
          [ "${VERDICT:-}" = pass ]
