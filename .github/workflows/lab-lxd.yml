# Dispatch: run a scenario against Juju on LXD (machine charms).
# Thin caller: run-name, concurrency and permissions live here; the harness is
# ./.github/workflows/_run.yml. The calling job must grant contents: read
# (a called workflow can only narrow permissions), and every input is
# forwarded explicitly with with:.
name: lab-lxd
run-name: ${{ inputs.scenario }} ${{ inputs.ref || inputs.juju_channel }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Folder under scenarios/ to run"
        required: true
        type: string
      juju_channel:
        description: "Juju snap channel (snap mode), e.g. 4.0/stable"
        required: false
        type: string
        default: "4.0/stable"
      ref:
        description: "Optional juju/juju tag or SHA; switches to build mode"
        required: false
        type: string
        default: ""
      tests_ref:
        description: "Optional juju/juju tag or SHA for tests/ (default derived)"
        required: false
        type: string
        default: ""
      repeat:
        description: "Iterations, 1-10"
        required: false
        type: string
        default: "1"
      request_id:
        description: "Caller nonce for run lookup ([A-Za-z0-9-], max 64)"
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  # Per workflow. With cancel-in-progress: false a duplicate dispatch with the same
  # request_id waits for the first one (serialised, not de-duplicated).
  group: ${{ github.workflow }}-${{ inputs.request_id || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    permissions:
      contents: read
    # Workspace-relative form kept: actionlint 1.7.12 (latest) rejects the newer `$/` form.
    uses: ./.github/workflows/_run.yml # zizmor: ignore[self-repository]
    with:
      substrate: lxd
      scenario: ${{ inputs.scenario }}
      juju_channel: ${{ inputs.juju_channel }}
      ref: ${{ inputs.ref }}
      tests_ref: ${{ inputs.tests_ref }}
      repeat: ${{ inputs.repeat }}
      request_id: ${{ inputs.request_id }}
